name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: true
        default: 'Wrappr App'
      app_url:
        description: 'Website Target URL'
        required: true
        default: 'https://google.com'

jobs:
  build-apk:
    name: Generate Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Template Source Code
        uses: actions/checkout@v4
        with:
          repository: 'ideabroofficial/wrappr-template-code'
          token: ${{ secrets.TEMPLATE_PAT }}
          ref: 'main'

      - name: Set up Java JDK (Version 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Patch Kotlin & Gradle Version
        run: |
          echo "Upgrading Kotlin version across all gradle files..."
          # Update Kotlin version in settings.gradle / settings.gradle.kts
          find android/ -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E 's/org.jetbrains.kotlin.android" version "[0-9.]+"/org.jetbrains.kotlin.android" version "2.2.20"/g' {} +
          find android/ -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E 's/kotlin\("jvm"\) version "[0-9.]+"/kotlin("jvm") version "2.2.20"/g' {} +
          find android/ -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle.kts" -o -name "build.gradle" \) -exec sed -i -E 's/ext.kotlin_version = .*/ext.kotlin_version = '\''2.2.20'\''/g' {} +

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
